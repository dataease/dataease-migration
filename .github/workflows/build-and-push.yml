name: build-and-push

run-name: 构建镜像并推送仓库 ${{ inputs.dockerImageTag }} (${{ inputs.registry }}) (${{ inputs.architecture }})

on:
  workflow_dispatch:
    inputs:
      dockerImageTag:
        description: 'Image Tag'
        default: 'dev'
        required: true
      dockerImageTagWithLatest:
        description: '正式发版时同时更新主版本标签和 latest'
        default: false
        required: true
        type: boolean
      architecture:
        description: 'Architecture'
        required: true
        default: 'linux/amd64'
        type: choice
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64
      registry:
        description: 'Push To Registry'
        required: true
        default: 'aliyun-registry'
        type: choice
        options:
          - aliyun-registry

permissions:
  contents: read

jobs:
  build-and-push-to-aliyun-registry:
    if: inputs.registry == 'aliyun-registry'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Aliyun Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY_HOST }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - name: Build and push image
        shell: bash
        env:
          REGISTRY_HOST: ${{ secrets.ALIYUN_REGISTRY_HOST }}
          PLATFORMS: ${{ inputs.architecture }}
          IMAGE_TAG: ${{ inputs.dockerImageTag }}
          PUBLISH_LATEST: ${{ inputs.dockerImageTagWithLatest }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker image tag"
            exit 1
          fi

          image="$REGISTRY_HOST/dataease/dataease-migration"
          tags=(--tag "$image:$IMAGE_TAG")
          if [[ "$PUBLISH_LATEST" == "true" ]]; then
            tags+=(--tag "$image:${IMAGE_TAG%%.*}" --tag "$image:latest")
          fi

          docker buildx build --platform "$PLATFORMS" --provenance=false --sbom=false \
            --no-cache "${tags[@]}" --push .
