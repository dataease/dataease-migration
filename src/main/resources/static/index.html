<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataEase 数据迁移</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main>
    <h1>DataEase 2.0 → 3.0 数据迁移</h1>
    <p class="warning">执行后会删除并重建 DataEase 3.0 的目标数据库。请先确认目标库可被覆盖。</p>
    <form id="migration-form">
      <section class="connection-mode">
        <h2>服务器连接方式</h2>
        <p>工具会分别判断源端和目标端：localhost、127.x、::1 或本机网卡地址直接操作本地安装目录，远程地址通过 SSH 操作。无论使用哪种连接方式，文件、数据库、升级脚本、插件及同步管理都会执行相同的完整迁移流程。</p>
        <label class="wide checkbox">
          <input name="copySyncTaskLogs" type="checkbox">
          复制同步任务物理日志（默认关闭，可大幅增加耗时与磁盘占用）
        </label>
      </section>
      <section>
        <h2>DataEase 2.0（源端）</h2>
        <div class="grid">
          <label>服务器 IP / 主机名<input name="sourceServer.host" required></label>
          <label>SSH 端口（远程地址必填）<input name="sourceServer.port" type="number" min="1" max="65535" value="22"></label>
          <label>SSH 用户名（远程地址必填）<input name="sourceServer.username" value="root"></label>
          <label>SSH 密码（远程地址必填）<input name="sourceServer.password" type="password" autocomplete="new-password"></label>
          <label>数据库 JDBC URL<input name="sourceDatabase.jdbcUrl" placeholder="jdbc:mysql://127.0.0.1:3306/dataease" required></label>
          <label>数据库用户<input name="sourceDatabase.username" value="root" required></label>
          <label>数据库密码<input name="sourceDatabase.password" type="password" required autocomplete="new-password"></label>
          <label class="wide">DataEase 安装目录<input name="sourceServer.installPath" value="/opt/dataease2.0" required></label>
        </div>
      </section>
      <section>
        <h2>DataEase 3.0（目标端）</h2>
        <div class="grid">
          <label>服务器 IP / 主机名<input name="targetServer.host" required></label>
          <label>SSH 端口（远程地址必填）<input name="targetServer.port" type="number" min="1" max="65535" value="22"></label>
          <label>SSH 用户名（远程地址必填）<input name="targetServer.username" value="root"></label>
          <label>SSH 密码（远程地址必填）<input name="targetServer.password" type="password" autocomplete="new-password"></label>
          <label>数据库 JDBC URL<input name="targetDatabase.jdbcUrl" placeholder="jdbc:mysql://127.0.0.1:3306/dataease" required></label>
          <label>数据库用户<input name="targetDatabase.username" value="root" required></label>
          <label>数据库密码<input name="targetDatabase.password" type="password" required autocomplete="new-password"></label>
          <label class="wide">DataEase 3.0 安装目录<input name="targetServer.installPath" value="/opt/dataease3.0" required></label>
        </div>
      </section>
      <button id="submit-button" type="submit">执行迁移</button>
    </form>
    <section class="logs-section">
      <h2>操作日志</h2>
      <pre id="logs" aria-live="polite">等待执行迁移任务。</pre>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
